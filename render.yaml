# Render deployment configuration
services:
  # Backend API
  - type: web
    name: hosting-api
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm run seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3001

  # Frontend (Static Site)
  - type: web
    name: hosting-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: hosting-api
          type: web
          property: host
